[package]
name = "dial-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
evdev = { version = "0.13.2", features = ["tokio"] }
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal"] }
zbus = "6.1.0"
