[package]
name = "dial-daemon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Use the CMF Buds Pro 2 Smart Dial as a control surface on the COSMIC desktop"

[dependencies]
chrono = "0.4.45"
cosmic-protocols = "0.2.0"
evdev = { version = "0.13.2", features = ["tokio"] }
fontdue = "0.9.5"
futures-util = "0.3.34"
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal", "process"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = "6.1.0"
